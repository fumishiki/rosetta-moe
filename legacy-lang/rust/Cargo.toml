[workspace]
resolver = "2"
members = [
    "api",
    "inference",
    "cli",
    "web",
    "ffi_julia",
]

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jlrs = { version = "0.22", features = ["tokio", "local-rt"] }
burn = { version = "0.19", features = ["train"] }
burn-wgpu = "0.19"
ratatui = "0.29"
indicatif = "0.17"
tonic = "0.12"
